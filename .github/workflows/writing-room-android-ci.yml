name: Writing Room Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Guard canonical Alexander name
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -R --include='*.kt' -n 'Alejandro' app/src/main; then
            echo "Canonical-name regression: Alexander must never be localized as Alejandro."
            exit 1
          fi

      - name: Unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release artifacts
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Release keystore detected. Decoding and compiling release bundle..."
            mkdir -p /home/runner/.jarvis
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > /home/runner/.jarvis/jarvis-release.jks
            export RELEASE_STORE_FILE="/home/runner/.jarvis/jarvis-release.jks"
            ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret provided; skipping release build."
          fi

      - name: Upload Release Bundle (AAB for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish signed APK as GitHub Release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || { echo "Signed release APK missing"; exit 1; }

          VERSION_CODE="$(grep -m1 'versionCode = ' app/build.gradle.kts | sed -E 's/.*= *([0-9]+).*/\1/')"
          VERSION_NAME="$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*= *"([^"]+)".*/\1/')"
          PACKAGE_NAME="com.jarvis.android"
          TAG="android-v${VERSION_CODE}"

          RELEASE_APK="$RUNNER_TEMP/JARVIS-release.apk"
          RELEASE_MANIFEST="$RUNNER_TEMP/JARVIS-release.json"
          cp "$APK" "$RELEASE_APK"
          SHA256="$(sha256sum "$RELEASE_APK" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c '%s' "$RELEASE_APK")"

          python3 - "$RELEASE_MANIFEST" "$VERSION_CODE" "$VERSION_NAME" "$PACKAGE_NAME" "$SHA256" "$SIZE_BYTES" "$GITHUB_SHA" <<'PY'
          import json, sys
          path, version_code, version_name, package_name, sha256, size_bytes, source_sha = sys.argv[1:]
          with open(path, "w", encoding="utf-8") as fh:
              json.dump({
                  "schema": "jarvis.android.signed-release.v1",
                  "version_code": int(version_code),
                  "version_name": version_name,
                  "package_name": package_name,
                  "sha256": sha256,
                  "size_bytes": int(size_bytes),
                  "source_sha": source_sha,
              }, fh, indent=2)
              fh.write("\n")
          PY

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" "$RELEASE_MANIFEST" --clobber
          else
            gh release create "$TAG" "$RELEASE_APK" "$RELEASE_MANIFEST" \
              --target "$GITHUB_SHA" \
              --title "JARVIS Android $VERSION_NAME" \
              --notes "Signed production APK for JARVIS Android $VERSION_NAME (versionCode $VERSION_CODE)." || \
            gh release upload "$TAG" "$RELEASE_APK" "$RELEASE_MANIFEST" --clobber
          fi

          echo "published_tag=$TAG"
          echo "published_package=$PACKAGE_NAME"
          echo "published_sha256=$SHA256"
