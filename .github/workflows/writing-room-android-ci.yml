name: Writing Room Android CI

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Generar APK debug manualmente (no se hace en CI normal)'
        type: boolean
        default: false
      publish_release:
        description: 'Generar y publicar APK/AAB firmadas manualmente'
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/writing-room-android-ci.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Guard canonical Alexander name
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -R --include='*.kt' -n 'Alejandro' app/src/main; then
            echo "Canonical-name regression: Alexander must never be localized as Alejandro."
            exit 1
          fi

      - name: Unit tests and Kotlin compilation (no APK)
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Android lint (no APK)
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Build debug APK (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload debug APK (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release artifacts (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Release keystore detected. Decoding and compiling release bundle..."
            mkdir -p /home/runner/.jarvis
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > /home/runner/.jarvis/jarvis-release.jks
            export RELEASE_STORE_FILE="/home/runner/.jarvis/jarvis-release.jks"
            ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace
          else
            echo "Missing release signing keystore; cannot publish a signed release." >&2
            exit 1
          fi

      - name: Upload Release Bundle (AAB for Google Play)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish signed APK as GitHub Release asset
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || { echo "Signed release APK missing"; exit 1; }
          # Gradle release signing must have produced a valid signature.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/build-tools" ] || {
            echo "Android SDK build-tools not found." >&2; exit 1;
          }
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ] || { echo "apksigner unavailable" >&2; exit 1; }
          "$APKSIGNER" verify "$APK"

          # Resolve identity from the APK actually compiled, not from Gradle
          # source text. The Gradle properties provide defaults/overrides, so
          # grep/sed of "versionName = jarvisVersionName.get()" is incorrect.
          AAPT="$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -name aapt -type f | sort -V | tail -n 1)"
          [ -n "$AAPT" ] && [ -x "$AAPT" ] || {
            echo "aapt not found in Android SDK build-tools." >&2; exit 1;
          }
          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE_INFO="$(printf '%s\n' "$BADGING" | python3 -c '
          import re, sys
          first = sys.stdin.readline().strip()
          if not first.startswith("package:"):
              raise SystemExit("APK package metadata missing")
          fields = {}
          for field in ("name", "versionCode", "versionName"):
              m = re.search(field + r"=\x27([^\x27]*)\x27", first)
              if not m or not m.group(1):
                  raise SystemExit("APK identity field missing: " + field)
              fields[field] = m.group(1)
          if fields["name"] != "com.jarvis.android":
              raise SystemExit("Unexpected APK applicationId: " + fields["name"])
          if not fields["versionCode"].isdigit():
              raise SystemExit("APK versionCode must be numeric")
          print(fields["name"])
          print(fields["versionCode"])
          print(fields["versionName"])
          ')"
          mapfile -t APK_IDENTITY <<< "$PACKAGE_INFO"
          [ "${#APK_IDENTITY[@]}" -eq 3 ] || {
            echo "Expected exactly three APK identity fields" >&2; exit 1;
          }
          PACKAGE_NAME="${APK_IDENTITY[0]}"
          VERSION_CODE="${APK_IDENTITY[1]}"
          VERSION_NAME="${APK_IDENTITY[2]}"
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] && [ "$VERSION_CODE" -ge 68 ] && [ -n "$VERSION_NAME" ] || {
            echo "APK release identity invalid or stale" >&2; exit 1;
          }
          TAG="android-v${VERSION_CODE}"

          RELEASE_APK="$RUNNER_TEMP/JARVIS-release.apk"
          RELEASE_MANIFEST="$RUNNER_TEMP/JARVIS-release.json"
          cp "$APK" "$RELEASE_APK"
          SHA256="$(sha256sum "$RELEASE_APK" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c '%s' "$RELEASE_APK")"

          python3 - "$RELEASE_MANIFEST" "$VERSION_CODE" "$VERSION_NAME" "$PACKAGE_NAME" "$SHA256" "$SIZE_BYTES" "$GITHUB_SHA" <<'PY'
          import json, sys
          path, version_code, version_name, package_name, sha256, size_bytes, source_sha = sys.argv[1:]
          with open(path, "w", encoding="utf-8") as fh:
              json.dump({
                  "schema": "jarvis.android.signed-release.v1",
                  "version_code": int(version_code),
                  "version_name": version_name,
                  "package_name": package_name,
                  "sha256": sha256,
                  "size_bytes": int(size_bytes),
                  "source_sha": source_sha,
              }, fh, indent=2)
              fh.write("\n")
          PY

          if gh release view "$TAG" >/dev/null 2>&1; then
            # A versionCode is a permanent release identity. Never replace an
            # earlier APK with a different build under the same tag.
            EXISTING_DIR="$RUNNER_TEMP/existing-release"
            mkdir -p "$EXISTING_DIR"
            gh release download "$TAG" --pattern "JARVIS-release.json" --dir "$EXISTING_DIR"
            EXISTING_TARGET="$(gh release view "$TAG" --json targetCommitish --jq '.targetCommitish')"
            if [ "$EXISTING_TARGET" != "$GITHUB_SHA" ] || \
               ! cmp -s "$EXISTING_DIR/JARVIS-release.json" "$RELEASE_MANIFEST"; then
              echo "Release $TAG already belongs to another commit or artifact. Bump versionCode and versionName." >&2
              exit 1
            fi
            echo "Release $TAG already contains this exact build; leaving it unchanged."
          else
            gh release create "$TAG" "$RELEASE_APK" "$RELEASE_MANIFEST" \
              --target "$GITHUB_SHA" \
              --latest \
              --title "JARVIS Android $VERSION_NAME" \
              --notes "Signed production APK for JARVIS Android $VERSION_NAME (versionCode $VERSION_CODE)."
          fi

          echo "published_tag=$TAG"
          echo "published_package=$PACKAGE_NAME"
          echo "published_sha256=$SHA256"
