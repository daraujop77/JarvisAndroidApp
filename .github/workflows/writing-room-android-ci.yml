name: Writing Room Android CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release artifacts
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Release keystore detected. Decoding and compiling release bundle..."
            mkdir -p /home/runner/.jarvis
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > /home/runner/.jarvis/jarvis-release.jks
            export RELEASE_STORE_FILE="/home/runner/.jarvis/jarvis-release.jks"
            ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret provided; skipping release build."
          fi

      - name: Upload Release Bundle (AAB for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 14
