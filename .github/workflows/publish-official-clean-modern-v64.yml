name: Publish JARVIS Android v64 Official

# Publish only AFTER the normal main-branch CI has completed successfully.
# This job builds ONE production APK and publishes that exact verified binary.
on:
  workflow_run:
    workflows: ["Writing Room Android CI"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  signed-official-v64:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'release(android): official JARVIS v64')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      OFFICIAL_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      PREVIOUS_CERT_SHA256: 46dfbc0ab83fd6ae3a86e663a981ebe9541e50662903e2b8877fd4d16040f93a

    steps:
      - name: Checkout exact successful CI source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Enforce immutable version and safe publication prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$OFFICIAL_SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$OFFICIAL_SOURCE_SHA" || {
            echo "BLOCKED: main advanced after v64 validation"; exit 1;
          }
          grep -F 'versionCode = jarvisVersionCode ?: 64' app/build.gradle.kts
          grep -F 'versionName = "0.1.64-clean-modern-official"' app/build.gradle.kts
          grep -F 'isDebuggable = false' app/build.gradle.kts
          grep -F '.orElse("com.jarvis.android")' app/build.gradle.kts
          grep -F 'val developerOptionsEnabled: Boolean = com.jarvis.android.BuildConfig.DEBUG' app/src/main/java/com/jarvis/android/ui/JarvisViewModel.kt
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "android-v63" || {
            echo "BLOCKED: latest signed updater version changed"; exit 1;
          }
          if gh release view android-v64 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "BLOCKED: never overwrite an existing official v64"; exit 1;
          fi

      - name: Set up release build JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Restore original JARVIS direct-update signing identity
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/jarvis-signing"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-signing/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/jarvis-signing/release.jks" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/jarvis-signing/release.jks" \
            -storepass "$RELEASE_STORE_PASSWORD" > "$RUNNER_TEMP/jarvis-signing/cert-list.txt"
          python3 - "$RUNNER_TEMP/jarvis-signing/cert-list.txt" "$GITHUB_ENV" <<'PY'
          import os, re, sys
          entries = re.split(r"(?m)^Alias name:\s*", open(sys.argv[1], encoding="utf-8").read())[1:]
          matches = []
          for entry in entries:
              lines = entry.splitlines()
              if not lines:
                  continue
              match = re.search(r"(?m)^\s*SHA256:\s*([0-9a-fA-F:]+)\s*$", entry)
              if match and match.group(1).replace(":", "").lower() == os.environ["PREVIOUS_CERT_SHA256"]:
                  matches.append(lines[0].strip())
          if len(matches) != 1 or not matches[0] or any(c in matches[0] for c in "\n\r="):
              raise SystemExit("BLOCKED: keystore does not contain exactly one original JARVIS signing certificate")
          with open(sys.argv[2], "a", encoding="utf-8") as out:
              out.write("RELEASE_KEY_ALIAS=" + matches[0] + "\n")
          with open(os.path.join(os.environ["RUNNER_TEMP"], "jarvis-signing", "matched-alias.txt"), "w", encoding="utf-8") as out:
              out.write(matches[0] + "\n")
          print("Original v63-compatible signing alias found; keystore remains private.")
          PY

      - name: Build signed non-debuggable release APK once
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          # Match the original certificate regardless of any stale secret alias.
          export RELEASE_KEY_ALIAS="$(cat "$RUNNER_TEMP/jarvis-signing/matched-alias.txt")"
          test -n "$RELEASE_KEY_ALIAS"
          ./gradlew :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify signed APK identity, certificate and no debug flag
        shell: bash
        run: |
          set -Eeuo pipefail
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$TOOLS_DIR/aapt" dump badging "$APK" > "$RUNNER_TEMP/v64-badging.txt"
          BADGING="$(head -n1 "$RUNNER_TEMP/v64-badging.txt")"
          echo "$BADGING"
          [[ "$BADGING" == *"name='com.jarvis.android'"* ]]
          [[ "$BADGING" == *"versionCode='64'"* ]]
          [[ "$BADGING" == *"versionName='0.1.64-clean-modern-official'"* ]]
          ! grep -q 'application-debuggable' "$RUNNER_TEMP/v64-badging.txt"
          "$TOOLS_DIR/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/v64-signer.txt"
          mkdir -p "$RUNNER_TEMP/v63-official"
          gh release download android-v63 --repo "$GITHUB_REPOSITORY" \
            --pattern JARVIS-release.apk --dir "$RUNNER_TEMP/v63-official"
          "$TOOLS_DIR/apksigner" verify --print-certs "$RUNNER_TEMP/v63-official/JARVIS-release.apk" \
            > "$RUNNER_TEMP/v63-signer.txt"
          python3 - "$RUNNER_TEMP/v64-signer.txt" "$RUNNER_TEMP/v63-signer.txt" <<'PY'
          import os, re, sys
          def signer(file):
              lines = open(file, encoding="utf-8").read().splitlines()
              digests = [
                  match.group(1).lower()
                  for line in lines
                  if "certificate sha-256 digest" in line.casefold()
                  for match in [re.search(r"([0-9a-fA-F]{64})\s*$", line)]
                  if match
              ]
              if len(digests) != 1:
                  raise SystemExit("BLOCKED: expected one unambiguous certificate fingerprint")
              return digests[0]
          current, prior = signer(sys.argv[1]), signer(sys.argv[2])
          expected = os.environ["PREVIOUS_CERT_SHA256"]
          if prior != expected or current != prior:
              raise SystemExit("BLOCKED: signing identity does not match installed v63")
          print("Signed v64 verified: matches original v63 signing certificate.")
          PY

      - name: Publish official updater assets once
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "android-v63"
          if gh release view android-v64 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "BLOCKED: v64 already published"; exit 1;
          fi
          RELEASE_APK="$RUNNER_TEMP/JARVIS-release.apk"
          RELEASE_JSON="$RUNNER_TEMP/JARVIS-release.json"
          cp app/build/outputs/apk/release/app-release.apk "$RELEASE_APK"
          python3 - "$RELEASE_APK" "$RELEASE_JSON" <<'PY'
          import hashlib, json, os, pathlib, sys
          apk = pathlib.Path(sys.argv[1])
          raw = apk.read_bytes()
          manifest = {
              "schema": "jarvis.android.signed-release.v1",
              "version_code": 64,
              "version_name": "0.1.64-clean-modern-official",
              "package_name": "com.jarvis.android",
              "sha256": hashlib.sha256(raw).hexdigest(),
              "size_bytes": len(raw),
              "source_sha": os.environ["OFFICIAL_SOURCE_SHA"],
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          gh release create android-v64 "$RELEASE_APK" "$RELEASE_JSON" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$OFFICIAL_SOURCE_SHA" \
            --title "JARVIS Android v64 · Clean Modern" \
            --notes "Official signed direct update: Clean Modern UI, Chat Global, Writing Room Copilot, approved visual inspection, context and session improvements. Same package and signing certificate as v63. Non-debuggable release build." \
            --latest
          echo "Published one signed official v64 APK from validated main commit $OFFICIAL_SOURCE_SHA"

      - name: Recheck exact updater asset names, size and SHA256
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "android-v64"
          ASSETS="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/android-v64" --jq '.assets[].name' | sort)"
          EXPECTED="$(printf '%s\n' JARVIS-release.apk JARVIS-release.json | sort)"
          test "$ASSETS" = "$EXPECTED"
          mkdir -p "$RUNNER_TEMP/v64-verify"
          gh release download android-v64 --repo "$GITHUB_REPOSITORY" \
            --pattern 'JARVIS-release.apk' --pattern 'JARVIS-release.json' \
            --dir "$RUNNER_TEMP/v64-verify"
          python3 - "$RUNNER_TEMP/v64-verify" "$OFFICIAL_SOURCE_SHA" <<'PY'
          import hashlib, json, pathlib, sys
          folder, source = pathlib.Path(sys.argv[1]), sys.argv[2]
          data = (folder / "JARVIS-release.apk").read_bytes()
          info = json.loads((folder / "JARVIS-release.json").read_text(encoding="utf-8"))
          assert info["schema"] == "jarvis.android.signed-release.v1"
          assert info["version_code"] == 64
          assert info["version_name"] == "0.1.64-clean-modern-official"
          assert info["package_name"] == "com.jarvis.android"
          assert info["source_sha"] == source
          assert info["sha256"] == hashlib.sha256(data).hexdigest()
          assert info["size_bytes"] == len(data) and len(data) > 1000000
          print("Official updater v64 verified with correct names and SHA256.")
          PY
