name: Copilot Approved Visuals Signed APK Preview v63

on:
  push:
    branches:
      - build/copilot-approved-visuals-signed-v63-20261011

permissions:
  contents: read

jobs:
  signed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout reviewed source with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed app source and isolated build-only changes
        shell: bash
        run: |
          set -Eeuo pipefail
          APPROVED="060d4f8bdde9d3486a6718ee30eec0f896a1e527"
          git cat-file -e "$APPROVED^{commit}"
          test "$(git merge-base "$APPROVED" HEAD)" = "$APPROVED"
          ACTUAL="$(git diff --name-only "$APPROVED" HEAD | sort)"
          EXPECTED="$(printf '%s\n' '.github/workflows/copilot-approved-visuals-signed-preview-v63-20261011.yml' 'app/build.gradle.kts' | sort)"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "Refusing extra app/code changes"; exit 1;
          }
          git diff --unified=0 "$APPROVED" HEAD -- app/build.gradle.kts
          grep -F 'versionCode = jarvisVersionCode ?: 63' app/build.gradle.kts
          grep -F 'versionName = "0.1.63-copilot-approved-visuals"' app/build.gradle.kts
          grep -F '.orElse("com.jarvis.android")' app/build.gradle.kts
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Restore original direct-APK signing certificate
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/jarvis-signing"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-signing/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/jarvis-signing/release.jks" >> "$GITHUB_ENV"
      - name: Require original v61 signing certificate before building
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          # The original v61 certificate was independently verified and is also
          # the signer of the published v62 APK.
          keytool -list -v -keystore "$RELEASE_STORE_FILE" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            > "$RUNNER_TEMP/jarvis-keystore-certificates.txt"
          python3 - "$RUNNER_TEMP/jarvis-keystore-certificates.txt" "$GITHUB_ENV" <<'PY'
          import os, re, sys
          expected = "46dfbc0ab83fd6ae3a86e663a981ebe9541e50662903e2b8877fd4d16040f93a"
          path, env_file = sys.argv[1:]
          contents = open(path, encoding="utf-8").read()
          entries = re.split(r"(?m)^Alias name:\s*", contents)[1:]
          matches = []
          for entry in entries:
              lines = entry.splitlines()
              if not lines:
                  continue
              alias = lines[0].strip()
              match = re.search(r"(?m)^\s*SHA256:\s*([0-9A-Fa-f:]+)\s*$", entry)
              if not match:
                  continue
              fingerprint = match.group(1).replace(":", "").lower()
              if fingerprint == expected:
                  matches.append(alias)
          if len(matches) != 1 or not matches[0] or any(ch in matches[0] for ch in "\n\r="):
              print("Signing compatibility BLOCKED: no unique signing alias matching GitHub v61.")
              print("The current keystore must be restored to the v61 signing identity.")
              print("App source remains unchanged; do not uninstall the existing JARVIS app.")
              sys.exit(1)
          with open(env_file, "a", encoding="utf-8") as out:
              out.write("RELEASE_KEY_ALIAS=" + matches[0] + "\n")
          alias_file = os.path.join(os.environ["RUNNER_TEMP"], "jarvis-signing", "matched-alias.txt")
          with open(alias_file, "w", encoding="utf-8") as out:
              out.write(matches[0] + "\n")
          print("Original v61 signing certificate found. Safe to attempt signed v63 update.")
          PY
      - name: Test and build signed update APK without publishing
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          # Force the exact alias independently of job-level secret precedence.
          export RELEASE_KEY_ALIAS="$(cat "$RUNNER_TEMP/jarvis-signing/matched-alias.txt")"
          test -n "$RELEASE_KEY_ALIAS"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Verify package, version code and existing release signing identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$TOOLS_DIR/apksigner"
          test -x "$TOOLS_DIR/aapt"
          PACKAGE="$("$TOOLS_DIR/aapt" dump badging "$APK" | head -n 1)"
          echo "$PACKAGE"
          [[ "$PACKAGE" == *"name='com.jarvis.android'"* ]]
          [[ "$PACKAGE" == *"versionCode='63'"* ]]
          "$TOOLS_DIR/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/current-signature.txt"
          mkdir -p "$RUNNER_TEMP/prior-release"
          gh release download android-v62 --repo "$GITHUB_REPOSITORY" \
            --pattern 'JARVIS-release.apk' --dir "$RUNNER_TEMP/prior-release"
          "$TOOLS_DIR/apksigner" verify --print-certs "$RUNNER_TEMP/prior-release/JARVIS-release.apk" > "$RUNNER_TEMP/prior-signature.txt"
          python3 - "$RUNNER_TEMP/current-signature.txt" "$RUNNER_TEMP/prior-signature.txt" <<'PY'
          import re
          import sys

          expected_v61 = "46dfbc0ab83fd6ae3a86e663a981ebe9541e50662903e2b8877fd4d16040f93a"

          def signer_sha(path):
              output = open(path, encoding="utf-8").read()
              for line in output.splitlines():
                  if "sha" not in line.lower() or "256" not in line:
                      continue
                  digests = re.findall(
                      r"(?<![0-9a-fA-F])(?:[0-9a-fA-F]{2}:){31}[0-9a-fA-F]{2}(?![0-9a-fA-F])|(?<![0-9a-fA-F])[0-9a-fA-F]{64}(?![0-9a-fA-F])",
                      line,
                      re.IGNORECASE,
                  )
                  if digests:
                      return digests[-1].replace(":", "").lower()
              print("BLOCKED: apksigner did not provide a parseable SHA-256 certificate.")
              print("Public apksigner output for diagnosis:")
              print(output)
              sys.exit(1)

          current = signer_sha(sys.argv[1])
          prior = signer_sha(sys.argv[2])
          # A signing-certificate fingerprint is public metadata, not a keystore secret.
          print("Signed v63 certificate SHA-256:", current)
          print("Official v62 certificate SHA-256:", prior)
          if prior != expected_v61:
              print("BLOCKED: published v62 signer did not match the independently verified v61 baseline.")
              sys.exit(1)
          if current != prior:
              print("BLOCKED: signed v63 is incompatible with v62; keep existing app installed.")
              sys.exit(1)
          print("Verified: signed v63 and published v62 share the exact signing certificate.")
          PY
          sha256sum "$APK"
      - name: Upload signed v63 owner-preview APK only (no release)
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Copilot-approved-visuals-signed-update-v63
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
