name: Google Play Internal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "First use build-only; after the first manual Play upload, use publish-internal"
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - publish-internal

permissions:
  contents: read

jobs:
  play-internal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAY_PACKAGE_NAME: com.daraujop77.jarvis
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD"; exit 1; }
          mkdir -p "$RUNNER_TEMP/jarvis-signing"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-signing/jarvis-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/jarvis-signing/jarvis-release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed Google Play AAB
        shell: bash
        run: |
          set -Eeuo pipefail
          # Play versionCodes are independent from direct APK versionCodes.
          # Each workflow run gets a fresh value above the manual bootstrap build (22).
          PLAY_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          echo "PLAY_VERSION_CODE=$PLAY_VERSION_CODE" >> "$GITHUB_ENV"
          ./gradlew \
            -PjarvisApplicationId="$PLAY_PACKAGE_NAME" \
            -PjarvisVersionCode="$PLAY_VERSION_CODE" \
            :app:bundleRelease --stacktrace

      - name: Verify bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB" || { echo "Google Play AAB was not produced"; exit 1; }
          sha256sum "$AAB"

      - name: Upload Google Play AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: JARVIS-google-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Authenticate to Google
        id: google-auth
        if: ${{ inputs.mode == 'publish-internal' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Publish to Google Play Internal testing
        if: ${{ inputs.mode == 'publish-internal' }}
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          AAB_PATH: app/build/outputs/bundle/release/app-release.aab
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          package_name = os.environ["PLAY_PACKAGE_NAME"]
          token = os.environ["GOOGLE_PLAY_ACCESS_TOKEN"]
          aab_path = os.environ["AAB_PATH"]
          sha = os.environ.get("GITHUB_SHA", "")[:7]
          api = "https://androidpublisher.googleapis.com"

          def call(method, url, body=None, content_type=None, timeout=180):
              headers = {"Authorization": f"Bearer {token}"}
              data = None
              if body is not None:
                  if isinstance(body, (bytes, bytearray)):
                      data = body
                      headers["Content-Type"] = content_type or "application/octet-stream"
                  else:
                      data = json.dumps(body).encode("utf-8")
                      headers["Content-Type"] = content_type or "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      raw = resp.read()
                      return json.loads(raw.decode("utf-8")) if raw else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"Google Play API {exc.code}: {detail}") from exc

          encoded_package = urllib.parse.quote(package_name, safe="")
          edit = call(
              "POST",
              f"{api}/androidpublisher/v3/applications/{encoded_package}/edits",
              {},
          )
          edit_id = edit["id"]
          encoded_edit = urllib.parse.quote(edit_id, safe="")
          edit_base = f"{api}/androidpublisher/v3/applications/{encoded_package}/edits/{encoded_edit}"

          try:
              with open(aab_path, "rb") as fh:
                  bundle_bytes = fh.read()

              bundle = call(
                  "POST",
                  f"{api}/upload/androidpublisher/v3/applications/{encoded_package}/edits/{encoded_edit}/bundles?uploadType=media",
                  bundle_bytes,
                  "application/octet-stream",
              )
              version_code = str(bundle["versionCode"])

              track = {
                  "track": "internal",
                  "releases": [
                      {
                          "name": f"JARVIS Internal {version_code} ({sha})",
                          "versionCodes": [version_code],
                          "status": "completed",
                      }
                  ],
              }
              call("PUT", f"{edit_base}/tracks/internal", track)
              call("POST", f"{edit_base}:commit")
              print(f"Published {package_name} versionCode={version_code} to Internal testing")
          except Exception:
              try:
                  call("DELETE", edit_base)
              except Exception:
                  pass
              raise
          PY
