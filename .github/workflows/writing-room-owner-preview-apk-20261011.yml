name: Writing Room Owner Preview APK

on:
  push:
    branches:
      - build/writing-room-debug-apk-0d46a57-20261011

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out owner-preview code
        uses: actions/checkout@v4
      - name: Verify app source matches approved main commit
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED="0d46a574e846a552be91b533cc8bbb8d00e60dd2"
          test "$(git rev-parse HEAD^)" = "$EXPECTED" || {
            echo "Refusing to build app source that differs from reviewed main"; exit 1;
          }
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/writing-room-owner-preview-apk-20261011.yml" || {
            echo "Refusing additional code changes in preview branch"; exit 1;
          }
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Assemble debug APK for owner review
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-WritingRoom-debug-0d46a57
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
