name: Writing Room Owner Preview APK

on:
  push:
    branches:
      - build/writing-room-debug-apk-0d46a57-20261011

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out owner-preview code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify app source matches approved main commit
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED="0d46a574e846a552be91b533cc8bbb8d00e60dd2"
          git cat-file -e "$EXPECTED^{commit}" || {
            echo "Reviewed main commit is unavailable"; exit 1;
          }
          git merge-base --is-ancestor "$EXPECTED" HEAD || {
            echo "Preview branch does not descend from the reviewed code"; exit 1;
          }
          CHANGED="$(git diff --name-only "$EXPECTED" HEAD)"
          test "$CHANGED" = ".github/workflows/writing-room-owner-preview-apk-20261011.yml" || {
            echo "Refusing to build: changes beyond the standalone preview workflow"; exit 1;
          }
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Assemble debug APK for owner review
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-WritingRoom-debug-0d46a57
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
